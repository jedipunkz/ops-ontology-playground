services:
  typedb:
    build:
      context: ./docker/typedb
    # Only the HTTP API is published, and only on loopback. The gRPC port
    # (1729) and the monitoring port (4104) stay inside the container.
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - --logging.directory=/var/lib/typedb/logs
      # Disable usage and error reports that TypeDB sends by default.
      - --diagnostics.reporting.metrics=false
      - --diagnostics.reporting.errors=false
    volumes:
      - typedb-data:/var/lib/typedb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  typedb-data:
