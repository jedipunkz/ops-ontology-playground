services:
  fuseki:
    build:
      context: ./docker/fuseki
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki-data:/fuseki/databases
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          -H 'Content-Type: application/sparql-query'
          --data 'ASK {}'
          http://127.0.0.1:3030/ops/query
          > /dev/null
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  fuseki-data:
